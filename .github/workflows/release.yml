name: Release

# Push a tag vX.Y.Z or vX.Y.Z-beta.N (see RELEASING.md) and this builds, notarizes, publishes the
# GitHub release and adds the item to the appcast. "Run workflow" with dry_run (the default) builds an
# ad-hoc signed app, skips notarization and publishing, and uploads the zip as an artifact. "Run workflow" with
# rehearsal, from a rehearsal-* tag, does everything a real release does up to publishing (Developer ID signature,
# notarization, staple, Sparkle signature, a signed appcast) and publishes nothing; the artifact is encrypted to
# a public key you pass in, because the signed app carries the certificate's name and this repository is public.
#
# Secrets live in the GitHub environment `release` (deployment rule: v* tags only), and only the build and
# publish jobs of a real release enter it. A dry run uses the secret-less environment `release-dry-run`.
# The gate resolves the tag to a commit once; every later job checks out that commit, not the tag name, and
# re-checks that the tag still points at it. A real release runs from the tag itself: by pushing it, or by
# "Run workflow" with the tag chosen as the ref (needed for allow_unsoaked_stable).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Dry run only: the tag to build (vX.Y.Z or vX.Y.Z-beta.N); empty builds the selected branch as a dev version. A real run ignores this and releases the tag chosen as the ref."
        required: false
        type: string
      dry_run:
        description: "Dry run: ad-hoc signature, no notarization, nothing published"
        required: true
        type: boolean
        default: true
      rehearsal:
        description: "Rehearsal: everything a real release does except publishing (real signature, notarization, appcast). Run from a rehearsal-* tag; 'tag' is the version to build; overrides dry_run"
        required: false
        type: boolean
        default: false
      artifact_key:
        description: "Rehearsal only: RSA public key (PEM, base64 on one line) the artifact is encrypted to"
        required: false
        type: string
      allow_unsoaked_stable:
        description: "Allow a stable tag that has no earlier beta of the same X.Y.Z (the promotion rule)"
        required: false
        type: boolean
        default: false

# No job gets more than it needs; each job asks for its own permissions.
permissions: {}

# Publishing runs one at a time and never cancels a run that is already updating the appcast. A third
# tag pushed while one run is publishing and another waits replaces the waiting one: push tags one at
# a time, and re-run a cancelled run from the Actions tab.
concurrency:
  group: ${{ inputs.rehearsal && 'microfish-release-rehearsal' || (inputs.dry_run && 'microfish-release-dry-run' || 'microfish-release-publish') }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The Rust toolchain every release is built with. rust-toolchain.toml says "stable", which moves: a stable
  # promoted weeks after its beta would be compiled by a different compiler than the build people tested.
  # Bump it here, on purpose, in a commit (RUSTUP_TOOLCHAIN below overrides the file).
  RUST_VERSION: "1.98.1"

jobs:
  gate:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      short: ${{ steps.gate.outputs.short }}
      channel: ${{ steps.gate.outputs.channel }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
      rehearsal: ${{ steps.gate.outputs.rehearsal }}
      ref_tag: ${{ steps.gate.outputs.ref_tag }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch and tag: the gate needs origin/main, origin/release/* and the tags
          fetch-tags: true
          persist-credentials: false
      - name: Validate the tag and the promotion rule
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUSHED_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ALLOW_UNSOAKED: ${{ inputs.allow_unsoaked_stable }}
          INPUT_REHEARSAL: ${{ inputs.rehearsal }}
          INPUT_ARTIFACT_KEY: ${{ inputs.artifact_key }}
          DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          if [ "$EVENT" != push ] && [ "$INPUT_REHEARSAL" = true ]; then
            # A rehearsal enters the `release` environment (real secrets), so like a real release it runs only from
            # a protected tag (rehearsal-*, allowed by the environment's tag rules), and that tag must be on main.
            # The version it builds comes from the `tag` input and need not exist: nothing is published.
            [ "$REF_TYPE" = tag ] && [[ "$PUSHED_REF_NAME" == rehearsal-* ]] || { echo "::error::A rehearsal runs from a rehearsal-* tag: choose it under 'Use workflow from'."; exit 1; }
            [ -n "$INPUT_TAG" ] || { echo "::error::A rehearsal needs the version to build in 'tag' (for example v0.1.0-beta.1)."; exit 1; }
            [ -n "$INPUT_ARTIFACT_KEY" ] || { echo "::error::A rehearsal needs artifact_key: the signed app carries the certificate's name and must not be a public artifact."; exit 1; }
            git rev-parse -q --verify "refs/remotes/origin/${DEFAULT_BRANCH}" >/dev/null || { echo "::error::origin/${DEFAULT_BRANCH} was not fetched."; exit 1; }
            sha="$(git rev-parse "refs/tags/$PUSHED_REF_NAME^{commit}")"
            git merge-base --is-ancestor "$sha" "origin/${DEFAULT_BRANCH}" || { echo "::error::$PUSHED_REF_NAME is not on ${DEFAULT_BRANCH}."; exit 1; }
            tag="$INPUT_TAG"
            fields="$(python3 -I app/Scripts/version.py "$tag" --env)"
            eval "$fields"
            {
              echo "tag=$tag"; echo "short=$SHORT"; echo "channel=$CHANNEL"; echo "prerelease=$PRERELEASE"
              echo "dry_run=false"; echo "rehearsal=true"; echo "ref_tag=$PUSHED_REF_NAME"; echo "sha=$sha"
            } >> "$GITHUB_OUTPUT"
            echo "### Rehearsal of $tag ($CHANNEL) from $PUSHED_REF_NAME, commit ${sha}: nothing is published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT" = push ]; then
            tag="$PUSHED_REF_NAME"; dry_run=false
          else
            tag="$INPUT_TAG"; dry_run="$INPUT_DRY_RUN"
            if [ "$dry_run" != true ]; then
              # A real release is bound to the tag it runs from: the environment's tag rule and the code that
              # runs both come from that tag, never from a branch.
              [ "$REF_TYPE" = tag ] || { echo "::error::A real release runs from its tag: push the tag, or choose the tag (not a branch) under 'Use workflow from'."; exit 1; }
              [ -z "$tag" ] || [ "$tag" = "$PUSHED_REF_NAME" ] || { echo "::error::The tag input ($tag) differs from the tag the workflow runs from ($PUSHED_REF_NAME)."; exit 1; }
              tag="$PUSHED_REF_NAME"
            fi
          fi
          if [ -z "$tag" ]; then
            [ "$dry_run" = true ] || { echo "::error::A real release needs a tag."; exit 1; }
            tag=dev; sha="$(git rev-parse "$GITHUB_SHA^{commit}")"
          else
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "::error::Tag $tag does not exist."; exit 1; }
            git rev-parse -q --verify "refs/remotes/origin/${DEFAULT_BRANCH}" >/dev/null || { echo "::error::origin/${DEFAULT_BRANCH} was not fetched."; exit 1; }
            # The one commit this whole run builds and publishes. Later jobs check out this SHA, never the tag name.
            sha="$(git rev-parse "refs/tags/$tag^{commit}")"
            if [ "$EVENT" = push ]; then
              pushed="$(git rev-parse "$GITHUB_SHA^{commit}")"
              [ "$pushed" = "$sha" ] || { echo "::error::Tag $tag points at ${sha:0:12} but the push that started this run was ${pushed:0:12}: the tag moved after it was pushed."; exit 1; }
            fi
            flags=()
            [ "$INPUT_ALLOW_UNSOAKED" = true ] && flags+=(--allow-unsoaked)
            app/Scripts/release-gate.sh "$tag" --main-ref "origin/${DEFAULT_BRANCH}" "${flags[@]+"${flags[@]}"}"
          fi
          fields="$(python3 -I app/Scripts/version.py "$tag" --env)"
          eval "$fields"
          {
            echo "tag=$tag"
            echo "short=$SHORT"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "dry_run=$dry_run"
            echo "rehearsal=false"
            echo "ref_tag=$([ "$tag" = dev ] || echo "$tag")"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "### $tag ($CHANNEL), commit ${sha}$([ "$dry_run" = true ] && echo ', dry run')" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, notarize, sign the update
    needs: gate
    runs-on: macos-26 # newest GA arm64 image (macos-latest is the same today); Xcode comes from select-xcode.sh
    timeout-minutes: 90
    # Real release: the `release` environment (secrets, tag rule, optional reviewer). Dry run: an empty one.
    environment: ${{ needs.gate.outputs.dry_run == 'true' && 'release-dry-run' || 'release' }}
    permissions:
      contents: read
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      SHA: ${{ needs.gate.outputs.sha }}
      DRY_RUN: ${{ needs.gate.outputs.dry_run }}
      REHEARSAL: ${{ needs.gate.outputs.rehearsal }}
      REF_TAG: ${{ needs.gate.outputs.ref_tag }}
      REPO: ${{ github.repository }}
    steps:
      - name: Where the temporary keychain goes
        run: echo "KEYCHAIN_PATH=$RUNNER_TEMP/microfish-build.keychain-db" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }} # the commit the gate approved, not the tag name
          persist-credentials: false
      - name: Check this is the approved commit and the tag has not moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::The checkout is not the commit the gate approved."; exit 1; }
          # The tag the run came from (a rehearsal's rehearsal-* tag; a release's own tag).
          if [ -n "$REF_TAG" ]; then app/Scripts/verify-tag.sh "$REF_TAG" "$SHA" "$REPO"; fi
      - name: Check the secrets are there
        if: ${{ needs.gate.outputs.dry_run != 'true' }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPSTORE_CONNECT_API_KEY_P8: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8 }}
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPSTORE_CONNECT_API_KEY_P8 \
                      APPSTORE_CONNECT_API_KEY_ID APPSTORE_CONNECT_API_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set in the release environment."; missing=1; fi
          done
          exit "$missing"
      - name: Select Xcode
        run: app/Scripts/select-xcode.sh
      - name: Rust toolchain (pinned)
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV" # overrides rust-toolchain.toml's "stable"
          RUSTUP_TOOLCHAIN="$RUST_VERSION" rustc --version
      - name: Fetch Sparkle (pinned, checksum-verified)
        run: app/Scripts/fetch-sparkle.sh
      - name: Build the signature checker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          swiftc -O app/Scripts/verify-ed-signature.swift -o "$RUNNER_TEMP/tools/verify-ed-signature"

      # Everything that runs dependency code (cargo build scripts, proc macros) happens HERE, before the
      # Developer ID certificate is imported or any key is unlocked. The steps after this one run only
      # swiftc and our own scripts.
      - name: Build the engine and the bridge (no signing key exists yet)
        run: app/Scripts/build-engine.sh

      - name: Import the Developer ID certificate into a temporary keychain
        if: ${{ needs.gate.outputs.dry_run != 'true' }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          p12="$RUNNER_TEMP/microfish-certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$p12"
          # Put it first in the search list so codesign and notarytool find it, and keep the others.
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $existing
          # The identity is looked up, never stored: it is the Developer ID Application certificate in the .p12.
          # Only its hash is kept (masked); the name and team are not printed.
          hash="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ {print $2; exit}')"
          [ -n "$hash" ] || { echo "::error::No Developer ID Application identity in the imported certificate."; exit 1; }
          echo "::add-mask::$hash"
          {
            echo "MICROFISH_SIGN_IDENTITY=$hash"
            echo "MICROFISH_KEYCHAIN=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"
          echo "Developer ID Application identity found in the temporary keychain."

      - name: Assemble, sign and verify Microfish.app
        run: |
          set -euo pipefail
          # A real release has no --allow-adhoc: build-app.sh refuses an ad-hoc versioned build. A dry run signs ad hoc.
          sign=(); [ "$DRY_RUN" = true ] && sign=(--sign - --allow-adhoc)
          app/Scripts/build-app.sh --version "$TAG" --skip-engine-build "${sign[@]+"${sign[@]}"}" --out "$RUNNER_TEMP/out"

      - name: Notarize
        if: ${{ needs.gate.outputs.dry_run != 'true' }}
        env:
          APPSTORE_CONNECT_API_KEY_P8: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8 }}
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPSTORE_CONNECT_API_KEY_P8" > "$key"
          app="$RUNNER_TEMP/out/Microfish.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize-upload.zip"
          result="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit "$RUNNER_TEMP/notarize-upload.zip" \
            --key "$key" --key-id "$APPSTORE_CONNECT_API_KEY_ID" --issuer "$APPSTORE_CONNECT_API_ISSUER_ID" \
            --wait --timeout 60m --output-format json > "$result" || true
          status="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$result" 2>/dev/null || true)"
          id="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "$result" 2>/dev/null || true)"
          echo "Notarization submission $id: ${status:-no status}"
          if [ "$status" != Accepted ]; then
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" --key "$key" --key-id "$APPSTORE_CONNECT_API_KEY_ID" --issuer "$APPSTORE_CONNECT_API_ISSUER_ID" || true
            else
              cat "$result" || true
            fi
            echo "::error::Notarization was not accepted (${status:-no status})."
            exit 1
          fi
          rm -f "$key" "$RUNNER_TEMP/notarize-upload.zip"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          # spctl -vv also prints "origin=Developer ID Application: <name> (<team>)": keep that out of the public log.
          verdict="$(spctl -a -vv -t exec "$app" 2>&1)" || { echo "::error::Gatekeeper rejected the app."; exit 1; }
          printf '%s\n' "$verdict" | grep -E ': accepted$|^source=' | sed 's|^.*Microfish.app|Microfish.app|'
          printf '%s\n' "$verdict" | grep -q '^source=Notarized Developer ID$' || { echo "::error::Gatekeeper does not see a notarized Developer ID app."; exit 1; }

      - name: Zip
        id: zip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          # Capture, then take the first line: `| head -n 1` closes the pipe early and pipefail fails the step.
          packaged="$(app/Scripts/package.sh "$RUNNER_TEMP/out/Microfish.app" --out "$RUNNER_TEMP/release")"
          printf '%s\n' "$packaged"
          zip_path="$(printf '%s\n' "$packaged" | sed -n 1p)"
          echo "zip=$zip_path" >> "$GITHUB_OUTPUT"
          plutil -extract LSMinimumSystemVersion raw "$RUNNER_TEMP/out/Microfish.app/Contents/Info.plist" > "$RUNNER_TEMP/release/min-macos.txt"
          ls -l "$RUNNER_TEMP/release"

      - name: Sign the update with the Sparkle EdDSA key
        if: ${{ needs.gate.outputs.dry_run != 'true' }}
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          set -euo pipefail
          # The key goes to sign_update on stdin; it is never written to disk.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | app/Vendor/Sparkle/bin/sign_update --ed-key-file - "$ZIP" > "$RUNNER_TEMP/release/signature.txt"
          grep -q 'sparkle:edSignature=' "$RUNNER_TEMP/release/signature.txt"
          cat "$RUNNER_TEMP/release/signature.txt"
          # Would an installed copy accept this? Check the signature against the SUPublicEDKey that is inside the
          # zip we are about to publish. A wrong or rotated-by-accident secret fails the release here, not in the field.
          unzip -p "$ZIP" Microfish.app/Contents/Info.plist > "$RUNNER_TEMP/zip-Info.plist"
          pub="$(plutil -extract SUPublicEDKey raw "$RUNNER_TEMP/zip-Info.plist")"
          "$RUNNER_TEMP/tools/verify-ed-signature" zip "$ZIP" --public-key "$pub" --signature-output "$RUNNER_TEMP/release/signature.txt"

      - name: Write, sign and check the appcast the publish job would push (rehearsal; nothing is pushed)
        if: ${{ needs.gate.outputs.rehearsal == 'true' }}
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/release/appcast.xml"
          python3 -I app/Scripts/appcast.py add --appcast "$feed" --tag "$TAG" --zip "$ZIP" \
            --signing-output "$(cat "$RUNNER_TEMP/release/signature.txt")" \
            --min-system "$(cat "$RUNNER_TEMP/release/min-macos.txt")" --notes embedded --repo "$REPO"
          python3 -I app/Scripts/appcast.py check "$feed"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | app/Vendor/Sparkle/bin/sign_update --ed-key-file - "$feed" >/dev/null
          pub="$(plutil -extract SUPublicEDKey raw "$RUNNER_TEMP/zip-Info.plist")"
          [ "$pub" = "$(tr -d '[:space:]' < app/Packaging/sparkle-public-key.txt)" ] || { echo "::error::The zip carries a different SUPublicEDKey than the repository."; exit 1; }
          "$RUNNER_TEMP/tools/verify-ed-signature" feed "$feed" --public-key "$pub"
          python3 -I app/Scripts/appcast.py check "$feed"

      - name: Encrypt the files to artifact_key (rehearsal; the signed app carries the certificate name)
        if: ${{ needs.gate.outputs.rehearsal == 'true' }}
        env:
          ARTIFACT_KEY: ${{ inputs.artifact_key }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/seal"; mkdir -p "$work"
          printf '%s' "$ARTIFACT_KEY" | base64 --decode > "$work/recipient.pem"
          /usr/bin/openssl pkey -pubin -in "$work/recipient.pem" -noout || { echo "::error::artifact_key is not a PEM public key."; exit 1; }
          tar -C "$RUNNER_TEMP/release" -cf "$work/files.tar" .
          key="$(/usr/bin/openssl rand -hex 32)"; iv="$(/usr/bin/openssl rand -hex 16)"
          echo "::add-mask::$key"
          sum="$(shasum -a 256 "$work/files.tar" | cut -d' ' -f1)"
          /usr/bin/openssl enc -aes-256-cbc -K "$key" -iv "$iv" -in "$work/files.tar" -out "$work/files.tar.enc"
          printf '%s %s %s' "$key" "$iv" "$sum" | /usr/bin/openssl pkeyutl -encrypt -pubin -inkey "$work/recipient.pem" \
            -pkeyopt rsa_padding_mode:oaep -out "$work/files.key.enc"
          rm -f "$work/files.tar" "$work/recipient.pem"
          # Only ciphertext goes into the artifact.
          rm -rf "$RUNNER_TEMP/release"; mkdir -p "$RUNNER_TEMP/release"
          mv "$work/files.tar.enc" "$work/files.key.enc" "$RUNNER_TEMP/release/"
          ls -l "$RUNNER_TEMP/release"

      - name: Self-test of the signature tooling (dry run, throwaway key)
        if: ${{ needs.gate.outputs.dry_run == 'true' }}
        run: app/Scripts/test-signing.sh "$RUNNER_TEMP/tools/verify-ed-signature"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.gate.outputs.rehearsal == 'true' && 'Microfish-rehearsal-encrypted' || (needs.gate.outputs.dry_run == 'true' && 'Microfish-dry-run' || 'Microfish-release') }}
          path: ${{ runner.temp }}/release/*
          retention-days: ${{ (needs.gate.outputs.dry_run == 'true' || needs.gate.outputs.rehearsal == 'true') && 7 || 30 }}
          if-no-files-found: error

      - name: Clean up keys and the temporary keychain
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/microfish-certificate.p12" "$RUNNER_TEMP/notarize-upload.zip"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          true

  publish:
    name: Publish the release and the appcast item
    needs: [gate, build]
    if: ${{ needs.gate.outputs.dry_run != 'true' && needs.gate.outputs.rehearsal != 'true' }}
    # macOS because Sparkle's sign_update (which signs the appcast) is a macOS tool. This job builds nothing
    # and runs only scripts from the approved commit; it holds the write token and the Sparkle key.
    runs-on: macos-26
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # create the release, push the appcast branch
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      SHORT: ${{ needs.gate.outputs.short }}
      SHA: ${{ needs.gate.outputs.sha }}
      PRERELEASE: ${{ needs.gate.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: true # the appcast push below uses it; nothing from the build runs in this job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Microfish-release
          path: release
      - name: Fetch Sparkle (pinned) and build the signature checker
        run: |
          set -euo pipefail
          app/Scripts/fetch-sparkle.sh
          mkdir -p "$RUNNER_TEMP/tools"
          swiftc -O app/Scripts/verify-ed-signature.swift -o "$RUNNER_TEMP/tools/verify-ed-signature"
      - name: Check the artifact once more before anything is published
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::The checkout is not the commit the gate approved."; exit 1; }
          zip="release/Microfish-${SHORT}.zip"
          [ -f "$zip" ] || { echo "::error::$zip is missing from the build artifact."; exit 1; }
          unzip -p "$zip" Microfish.app/Contents/Info.plist > "$RUNNER_TEMP/zip-Info.plist"
          pub="$(plutil -extract SUPublicEDKey raw "$RUNNER_TEMP/zip-Info.plist")"
          [ "$pub" = "$(tr -d '[:space:]' < app/Packaging/sparkle-public-key.txt)" ] || { echo "::error::The zip carries a different SUPublicEDKey than the repository."; exit 1; }
          [ "$(plutil -extract CFBundleShortVersionString raw "$RUNNER_TEMP/zip-Info.plist")" = "$SHORT" ] || { echo "::error::The zip is not version $SHORT."; exit 1; }
          "$RUNNER_TEMP/tools/verify-ed-signature" zip "$zip" --public-key "$pub" --signature-output release/signature.txt
          echo "SPARKLE_PUBLIC_KEY=$pub" >> "$GITHUB_ENV"
      - name: Create the GitHub release (first publishing step; existing assets are never changed)
        run: |
          set -euo pipefail
          app/Scripts/verify-tag.sh "$TAG" "$SHA" "$REPO"
          zip="release/Microfish-${SHORT}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run after the release was created: it must be the very same build, or stop.
            published="$(mktemp -d)"
            gh release download "$TAG" --pattern "Microfish-${SHORT}.zip" --dir "$published"
            if [ "$(shasum -a 256 "$published/Microfish-${SHORT}.zip" | cut -d' ' -f1)" != "$(shasum -a 256 "$zip" | cut -d' ' -f1)" ]; then
              echo "::error::$TAG is already published with a different build. Published assets are never replaced: fix forward with a new version."
              exit 1
            fi
            echo "Release $TAG already exists with this exact build; continuing to the appcast."
          else
            if [ "$PRERELEASE" = true ]; then
              flags=(--prerelease --latest=false)
            else
              # "Latest" belongs to the highest stable only: a hotfix to an older minor must not take it.
              stables="$(gh release list --limit 300 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')"
              if printf '%s\n' "$stables" | python3 -I app/Scripts/version.py is-latest "$TAG"; then flags=(--latest); else flags=(--latest=false); fi
            fi
            echo "gh release create flags: ${flags[*]}"
            gh release create "$TAG" "$zip" --verify-tag --title "Microfish ${SHORT}" --generate-notes "${flags[@]}"
          fi
      - name: Add the item to the appcast, sign the appcast, push the appcast branch
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          wt="$RUNNER_TEMP/appcast-worktree"
          if git ls-remote --exit-code --heads origin appcast >/dev/null 2>&1; then
            git fetch --no-tags origin appcast
            git worktree add "$wt" -B appcast origin/appcast
          else
            git worktree add --orphan -b appcast "$wt"
          fi
          for attempt in 1 2 3; do
            python3 -I app/Scripts/appcast.py add \
              --appcast "$wt/appcast.xml" \
              --tag "$TAG" \
              --zip "release/Microfish-${SHORT}.zip" \
              --signing-output "$(cat release/signature.txt)" \
              --min-system "$(cat release/min-macos.txt)" \
              --notes embedded \
              --repo "$REPO"
            python3 -I app/Scripts/appcast.py check "$wt/appcast.xml"
            # Sign the feed itself (the app requires it: SURequireSignedFeed). The key goes in on stdin.
            printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | app/Vendor/Sparkle/bin/sign_update --ed-key-file - "$wt/appcast.xml" >/dev/null
            "$RUNNER_TEMP/tools/verify-ed-signature" feed "$wt/appcast.xml" --public-key "$SPARKLE_PUBLIC_KEY"
            python3 -I app/Scripts/appcast.py check "$wt/appcast.xml"
            git -C "$wt" add appcast.xml
            if git -C "$wt" diff --cached --quiet; then
              echo "The appcast already has this item."; break
            fi
            git -C "$wt" commit -m "appcast: ${SHORT}"
            if git -C "$wt" push origin appcast; then break; fi
            [ "$attempt" = 3 ] && { echo "::error::Could not push the appcast branch."; exit 1; }
            # Someone else pushed first: start again from their file (a signed one-line file does not rebase).
            git -C "$wt" fetch --no-tags origin appcast
            git -C "$wt" reset --hard origin/appcast
          done
          echo "Appcast: https://raw.githubusercontent.com/${REPO}/appcast/appcast.xml" >> "$GITHUB_STEP_SUMMARY"
